<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>インデント整形 ＆ 階層レインボーかっこチェッカー 🔍</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --accent: #38bdf8;
      --danger: #ef4444;
      --danger-bg: #450a0a;
      --border: #334155;
      --success: #10b981;
    }
    body {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      line-height: 1.5;
    }
    .container { max-width: 1280px; margin: 0 auto; }
    textarea {
      width: 100%;
      height: 200px;
      background: #090d16;
      color: #94a3b8;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 0.9rem;
      resize: vertical;
      outline: none;
    }
    textarea:focus { border-color: var(--accent); }
    .file-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 12px 0;
    }
    button, .file-btn {
      padding: 10px 16px;
      font-size: 0.9rem;
      font-weight: bold;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary { background: #2563eb; flex: 2; min-width: 180px; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-format { background: #059669; flex: 2; min-width: 180px; }
    .btn-format:hover { background: #047857; }
    .btn-sub { background: #475569; flex: 1; min-width: 110px; }
    .btn-sub:hover { background: #334155; }
    .file-btn { background: #0284c7; }
    .file-btn:hover { background: #0369a1; }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .culprit-card {
      background: var(--danger-bg);
      border: 1px solid #991b1b;
      border-left: 6px solid var(--danger);
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 10px;
    }
    #codeViewer {
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      height: 540px;
      overflow: auto;
      font-size: 0.85rem;
      white-space: pre;
      contain: content;
    }
    .code-line {
      display: flex;
      align-items: center;
      height: 1.6em;
      box-sizing: border-box;
    }
    .code-line.culprit-highlight {
      background: rgba(239, 68, 68, 0.25) !important;
    }
    .line-num {
      width: 48px;
      flex-shrink: 0;
      color: #475569;
      user-select: none;
      text-align: right;
      padding-right: 10px;
      font-size: 0.8rem;
    }
    .depth-indicator {
      flex-shrink: 0;
      height: 100%;
      margin-right: 10px;
    }
    .line-content {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: pre;
    }
    .bracket-pair {
      font-weight: bold;
      border-bottom: 2px solid;
    }
    .notice {
      color: var(--success);
      font-size: 0.85rem;
      font-weight: bold;
      margin-left: 10px;
    }
    .edit-badge {
      display: inline-block;
      background: #f59e0b;
      color: #0f172a;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
    }
    footer {
      margin-top: 50px;
      padding: 24px 0;
      text-align: center;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .note-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--accent);
      text-decoration: none;
      font-weight: bold;
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: rgba(56, 189, 248, 0.08);
      transition: all 0.2s;
    }
    .note-link:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2 style="color:var(--accent); margin:0 0 8px;">✨ インデント整形 ＆ 階層レインボーかっこチェッカー</h2>
    <div style="font-size:0.85rem; color:#94a3b8; margin-bottom:14px;">
      AI生成コードのガタガタな行頭を瞬時に整列！カラー帯インジケーターで階層の崩れを肉眼で暴きます 🕵️‍♀️🎨
    </div>

    <!-- ファイル選択＆読込バー -->
    <div class="file-bar">
      <label class="file-btn">
        📁 ファイルを選択して読み込む
        <input type="file" id="fileInput" accept=".js,.gs,.txt,.html,.json,.ts" style="display:none;" onchange="handleFileSelect(event)">
      </label>
      <span id="loadedFileName" style="font-size:0.85rem; color:#cbd5e1;">(ファイル未選択)</span>
      <span id="editStatusBadge" style="display:none;" class="edit-badge">編集中 ✏️</span>
    </div>

    <textarea id="inputText" placeholder="AIからコピペしたコードを貼り付けるか、上のボタンからファイルを選択してね！"></textarea>
    
    <div class="btn-row">
      <button class="btn-format" onclick="formatIndent()">🧹 行頭インデントを自動整列</button>
      <button class="btn-primary" onclick="huntCulprit()">🔍 真犯人スキャン ＆ 階層可視化</button>
      <button class="btn-sub" onclick="downloadFormattedFile()">💾 保存 (DL)</button>
      <button class="btn-sub" onclick="copyText()">📋 コピー</button>
      <span id="statusNotice" class="notice"></span>
    </div>

    <!-- 真犯人ランキング -->
    <div id="culpritPanel" class="panel" style="display:none;">
      <h3 style="margin:0 0 10px; color:#f87171;">🎯 真犯人（ズレの発生源）候補</h3>
      <div id="culpritList"></div>
    </div>

    <!-- 肉眼ビューアー -->
    <div id="viewerPanel" class="panel" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <h3 style="margin:0; color:var(--accent);">👀 階層レインボービューアー</h3>
        <span style="font-size:0.8rem; color:#94a3b8;">左側の縦帯の太さ＝かっこの階層深さ（色も完全連動）</span>
      </div>
      <div id="codeViewer"></div>
    </div>

    <!-- フッター -->
    <footer>
      <p style="margin: 0 0 12px;">
        <a href="https://editor.note.com/notes/ne000eff3d5ac/edit/" target="_blank" rel="noopener noreferrer" class="note-link">
          📖 note開発ストーリーを読む ↗
        </a>
      </p>
      <p style="margin: 0; font-size: 0.8rem; opacity: 0.7;">
        &copy; 2026 MrHiraiwa | Released under the MIT License
      </p>
    </footer>
  </div>

  <script>
    let currentFileName = 'code.js';
    let isFileLoaded = false;

    const DEPTH_COLORS = [
      '#38bdf8', '#4ade80', '#facc15', '#fb923c',
      '#f472b6', '#a78bfa', '#2dd4bf', '#f87171'
    ];

    function getColorForDepth(d) {
      if (d <= 0) return '#475569';
      return DEPTH_COLORS[(d - 1) % DEPTH_COLORS.length];
    }

    document.getElementById('inputText').addEventListener('input', () => {
      const editBadge = document.getElementById('editStatusBadge');
      if (isFileLoaded && editBadge) editBadge.style.display = 'inline-block';
    });

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;

      currentFileName = file.name;
      isFileLoaded = true;

      document.getElementById('loadedFileName').textContent = `📄 ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
      const editBadge = document.getElementById('editStatusBadge');
      if (editBadge) editBadge.style.display = 'none';

      const reader = new FileReader();
      reader.onload = function(evt) {
        document.getElementById('inputText').value = evt.target.result;
        showNotice('📁 読み込み完了！');
        huntCulprit();
      };
      reader.readAsText(file, 'UTF-8');
      e.target.value = '';
    }

    function downloadFormattedFile() {
      const text = document.getElementById('inputText').value;
      if (!text.trim()) { alert('ダウンロードするコードがありません！'); return; }

      const now = new Date();
      const Y = now.getFullYear();
      const M = String(now.getMonth() + 1).padStart(2, '0');
      const D = String(now.getDate()).padStart(2, '0');
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const timeStr = `${Y}${M}${D}_${h}${m}`;

      const lastDot = currentFileName.lastIndexOf('.');
      let base = currentFileName;
      let ext = '.js';
      if (lastDot !== -1) {
        base = currentFileName.substring(0, lastDot);
        ext = currentFileName.substring(lastDot);
      }

      const outName = `${base}_${timeStr}${ext}`;

      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = outName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);

      showNotice(`💾 ${outName} を保存したよ！`);
    }

    function formatIndent() {
      const textarea = document.getElementById('inputText');
      const text = textarea.value;
      if (!text.trim()) { alert('コードを入力してね！'); return; }

      const lines = text.split('\n');
      const formattedLines = [];
      let depth = 0;
      const indentUnit = '  ';
      let modifiedCount = 0;

      for (let i = 0; i < lines.length; i++) {
        const raw = lines[i];
        const trimmed = raw.trim();

        if (trimmed === '') {
          if (raw !== '') modifiedCount++;
          formattedLines.push('');
          continue;
        }

        let openCount = 0;
        let closeCount = 0;
        let startsWithClose = false;

        if (/^[}\])]+/.test(trimmed)) startsWithClose = true;

        const clean = trimmed
          .replace(/\/\*[\s\S]*?\*\//g, '')
          .replace(/\/\/.*/g, '')
          .replace(/`([^`\\]|\\.)*`/g, '""')
          .replace(/"([^"\\]|\\.)*"/g, '""')
          .replace(/'([^'\\]|\\.)*'/g, "''");

        for (const ch of clean) {
          if (ch === '{') openCount++;
          if (ch === '}') closeCount++;
        }

        let currentLineDepth = depth;
        if (startsWithClose && depth > 0) currentLineDepth = depth - 1;

        const newLine = indentUnit.repeat(Math.max(0, currentLineDepth)) + trimmed;
        if (newLine !== raw) modifiedCount++;

        formattedLines.push(newLine);

        depth += (openCount - closeCount);
        if (depth < 0) depth = 0;
      }

      textarea.value = formattedLines.join('\n');
      if (modifiedCount > 0) {
        showNotice(`🧹 全 ${lines.length} 行中、${modifiedCount} 行のインデントを整列したよ！`);
      } else {
        showNotice(`✨ すでに全 ${lines.length} 行きれいに整列されています！`);
      }
    }

    // 文字列・コメント・正規表現リテラルを安全にスペース化
    function maskTokens(source) {
      const chars = source.split('');
      const len = chars.length;
      let i = 0;
      let state = 'CODE';
      let prevToken = '';

      while (i < len) {
        const c = chars[i];
        const next = chars[i + 1];

        if (state === 'CODE') {
          if (c === '/' && next === '/') {
            chars[i] = ' '; chars[i + 1] = ' ';
            state = 'LINE_COMMENT';
            i += 2; continue;
          } else if (c === '/' && next === '*') {
            chars[i] = ' '; chars[i + 1] = ' ';
            state = 'BLOCK_COMMENT';
            i += 2; continue;
          } else if (c === "'") {
            chars[i] = ' ';
            state = 'S_QUOTE';
            i++; continue;
          } else if (c === '"') {
            chars[i] = ' ';
            state = 'D_QUOTE';
            i++; continue;
          } else if (c === '`') {
            chars[i] = ' ';
            state = 'T_QUOTE';
            i++; continue;
          } else if (c === '/' && /[=(:,;!&|?{\[\n]/.test(prevToken)) {
            // 正規表現リテラル判定
            chars[i] = ' ';
            state = 'REGEX';
            i++; continue;
          }
          if (!/\s/.test(c)) prevToken = c;
        } else if (state === 'REGEX') {
          if (c === '\\') {
            chars[i] = ' ';
            if (next && next !== '\n') { chars[i + 1] = ' '; i++; }
          } else if (c === '/') {
            chars[i] = ' ';
            state = 'CODE';
            prevToken = '/';
          } else if (c !== '\n') {
            chars[i] = ' ';
          }
        } else if (state === 'LINE_COMMENT') {
          if (c === '\n') {
            state = 'CODE';
          } else {
            chars[i] = ' ';
          }
        } else if (state === 'BLOCK_COMMENT') {
          if (c === '*' && next === '/') {
            chars[i] = ' '; chars[i + 1] = ' ';
            state = 'CODE';
            i += 2; continue;
          } else if (c !== '\n') {
            chars[i] = ' ';
          }
        } else if (state === 'S_QUOTE') {
          if (c === '\\') {
            chars[i] = ' ';
            if (next && next !== '\n') { chars[i + 1] = ' '; i++; }
          } else if (c === "'") {
            chars[i] = ' ';
            state = 'CODE';
            prevToken = "'";
          } else if (c !== '\n') {
            chars[i] = ' ';
          }
        } else if (state === 'D_QUOTE') {
          if (c === '\\') {
            chars[i] = ' ';
            if (next && next !== '\n') { chars[i + 1] = ' '; i++; }
          } else if (c === '"') {
            chars[i] = ' ';
            state = 'CODE';
            prevToken = '"';
          } else if (c !== '\n') {
            chars[i] = ' ';
          }
        } else if (state === 'T_QUOTE') {
          if (c === '\\') {
            chars[i] = ' ';
            if (next && next !== '\n') { chars[i + 1] = ' '; i++; }
          } else if (c === '`') {
            chars[i] = ' ';
            state = 'CODE';
            prevToken = '`';
          } else if (c !== '\n') {
            chars[i] = ' ';
          }
        }
        i++;
      }
      return chars.join('');
    }

    function huntCulprit() {
      try {
        const text = document.getElementById('inputText').value;
        if (!text.trim()) {
          alert('コードを入力してね！');
          return;
        }

        const rawLines = text.split('\n');
        const cleanText = maskTokens(text);
        const cleanLines = cleanText.split('\n');

        const stack = [];
        const pairedList = [];
        let pairCounter = 1;
        const lineInfos = [];
        let currentDepth = 0;
        let lowestDepth = 0;
        let lowestDepthLine = 0;

        cleanLines.forEach((lText, lIdx) => {
          const raw = rawLines[lIdx];
          const lineNum = lIdx + 1;
          const depthBefore = currentDepth;

          for (let cIdx = 0; cIdx < lText.length; cIdx++) {
            const ch = lText[cIdx];
            if (ch === '{') {
              currentDepth++;
              stack.push({ id: pairCounter++, lineNum, colNum: cIdx + 1, depth: currentDepth, preview: raw.trim() });
            } else if (ch === '}') {
              currentDepth--;
              if (currentDepth < lowestDepth) {
                lowestDepth = currentDepth;
                lowestDepthLine = lineNum;
              }
              if (stack.length > 0) {
                const op = stack.pop();
                pairedList.push({
                  id: op.id,
                  openLine: op.lineNum,
                  openCol: op.colNum,
                  closeLine: lineNum,
                  closeCol: cIdx + 1,
                  depth: op.depth,
                  preview: op.preview
                });
              }
            }
          }

          lineInfos.push({
            lineNum,
            depthBefore,
            depthAfter: currentDepth,
            raw: raw.trim()
          });
        });

        const culprits = [];

        // A. 余分な閉じかっこ
        if (lowestDepth < 0) {
          culprits.push({
            score: 99,
            culpritLine: lowestDepthLine,
            title: `余分な閉じかっこ「 } 」`,
            desc: `<strong>${lowestDepthLine} 行目</strong> 付近で閉じかっこが多すぎます。余計な <code>}</code> を1つ削除してください！`
          });
        }

        // B. 関数の飲み込み事故
        let baseDepth = 0;
        for (let i = 0; i < Math.min(5, lineInfos.length); i++) {
          if (/^\s*(\(\s*(\(\)\s*=>|function)|<script>)/.test(lineInfos[i].raw)) {
            baseDepth = Math.max(baseDepth, lineInfos[i].depthAfter);
          }
        }

        for (let k = 1; k < lineInfos.length; k++) {
          const info = lineInfos[k];
          const isTopLevelFunction = /^(async\s+)?function\s+[a-zA-Z0-9_$]+/.test(info.raw);

          if (isTopLevelFunction && info.depthBefore > baseDepth) {
            const prevFuncLine = lineInfos.slice(0, k).reverse().find(l => /function/.test(l.raw));
            culprits.push({
              score: 98,
              culpritLine: prevFuncLine ? prevFuncLine.lineNum : info.lineNum - 1,
              title: `関数の飲み込み事故（直前の関数が閉じられていません！）`,
              desc: `<strong>${info.lineNum} 行目</strong> の関数が前の関数の中に飲み込まれています。直前の関数（${prevFuncLine ? prevFuncLine.lineNum + '行目付近' : ''}）の末尾に <code>}</code> が不足しています！`
            });
            break;
          }
        }

        // C. 未閉じかっこの不足
        if (currentDepth > 0 && culprits.length === 0) {
          const lastUnclosed = stack.length > 0 ? stack[stack.length - 1] : null;
          culprits.push({
            score: 95,
            culpritLine: lastUnclosed ? lastUnclosed.lineNum : rawLines.length,
            title: `閉じかっこ「 } 」の不足（${currentDepth} 個不足）`,
            desc: `ファイルの末尾まで到達しましたが、波かっこが閉じ切っていません（深さ: ${currentDepth}）。${lastUnclosed ? `<strong>${lastUnclosed.lineNum} 行目</strong> 付近で開かれたブロックの ` : ''}<code>}</code> が不足しています！`
          });
        }

        renderCulprits(culprits);
        renderVisualViewer(rawLines, pairedList, lineInfos, culprits);
        showNotice('🔍 スキャン完了！');
      } catch (err) {
        console.error("Scan Error:", err);
        alert(`スキャン中にエラーが発生しました: ${err.message}`);
      }
    }

    function renderCulprits(culprits) {
      const panel = document.getElementById('culpritPanel');
      const list = document.getElementById('culpritList');
      panel.style.display = 'block';

      if (culprits.length === 0) {
        list.innerHTML = '<span style="color:#4ade80; font-weight:bold;">🎉 構造上の深さズレは見つかりませんでした！完璧です✨</span>';
        return;
      }

      let html = '';
      culprits.forEach((c, idx) => {
        html += `
          <div class="culprit-card">
            <div style="font-size:1rem; font-weight:bold; color:#fca5a5;">🚨 真犯人 第${idx + 1}位: ${c.title}</div>
            <div style="margin: 8px 0; font-size:0.9rem;">${c.desc}</div>
            <button style="width:auto; padding:4px 12px; margin:4px 0 0; font-size:0.8rem; background:#dc2626;" onclick="jumpToLine(${c.culpritLine})">
              👉 ${c.culpritLine} 行目へジャンプして確認
            </button>
          </div>
        `;
      });
      list.innerHTML = html;
    }

    function renderVisualViewer(rawLines, pairedList, lineInfos, culprits) {
      const panel = document.getElementById('viewerPanel');
      const viewer = document.getElementById('codeViewer');
      panel.style.display = 'block';

      const openMap = {};
      const closeMap = {};
      pairedList.forEach(p => {
        openMap[`${p.openLine}:${p.openCol}`] = p;
        closeMap[`${p.closeLine}:${p.closeCol}`] = p;
      });

      const culpritLines = culprits.map(c => c.culpritLine);
      const barWidth = 6;
      const barGap = 3;
      const totalStep = barWidth + barGap;

      let html = '';
      rawLines.forEach((lineText, lIdx) => {
        const lineNum = lIdx + 1;
        const info = lineInfos[lIdx];
        const isCulprit = culpritLines.includes(lineNum);
        const displayDepth = Math.max(0, Math.max(info.depthBefore, info.depthAfter));

        let bgStyle = '';
        if (displayDepth > 0) {
          const stops = [];
          for (let d = 1; d <= displayDepth; d++) {
            const col = getColorForDepth(d);
            const start = (d - 1) * totalStep;
            const end = start + barWidth;
            stops.push(`${col} ${start}px`, `${col} ${end}px`, `transparent ${end}px`, `transparent ${end + barGap}px`);
          }
          const totalW = displayDepth * totalStep;
          bgStyle = `style="width:${totalW}px; background:repeating-linear-gradient(to right, ${stops.join(', ')});"`;
        } else {
          bgStyle = `style="width:0px;"`;
        }

        html += `<div id="code-line-${lineNum}" class="code-line ${isCulprit ? 'culprit-highlight' : ''}">`;
        html += `<div class="line-num">${lineNum}</div>`;
        html += `<div class="depth-indicator" ${bgStyle}></div>`;
        html += `<div class="line-content">`;

        for (let cIdx = 0; cIdx < lineText.length; cIdx++) {
          const ch = lineText[cIdx];
          const key = `${lineNum}:${cIdx + 1}`;

          if (openMap[key]) {
            const p = openMap[key];
            const col = getColorForDepth(p.depth);
            html += `<span class="bracket-pair" style="color:${col}; border-color:${col};">${escapeHtml(ch)}</span>`;
          } else if (closeMap[key]) {
            const p = closeMap[key];
            const col = getColorForDepth(p.depth);
            html += `<span class="bracket-pair" style="color:${col}; border-color:${col};">${escapeHtml(ch)}</span>`;
          } else {
            html += escapeHtml(ch);
          }
        }
        html += `</div></div>`;
      });

      viewer.innerHTML = html;
    }

    window.jumpToLine = function(lineNum) {
      const el = document.getElementById(`code-line-${lineNum}`);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.style.backgroundColor = '#b91c1c';
        setTimeout(() => { el.style.backgroundColor = ''; }, 1500);
      }
    };

    function copyText() {
      const text = document.getElementById('inputText').value;
      navigator.clipboard.writeText(text).then(() => {
        showNotice('📋 クリップボードにコピーしたよ！');
      });
    }

    function showNotice(msg) {
      const notice = document.getElementById('statusNotice');
      notice.textContent = msg;
      setTimeout(() => { notice.textContent = ''; }, 4000);
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }
  </script>
</body>
</html>
